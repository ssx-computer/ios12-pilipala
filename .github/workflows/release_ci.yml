name: Pilipala iOS 12

on:
  push:
    tags:
      - "v*.*.*"          # 推送 v1.0.0 之类的标签时触发
  workflow_dispatch:      # 也支持手动触发

jobs:
  iOS:
    runs-on: macos-14     # 使用 macOS 13，Xcode 14 对 iOS 12 更友好（macos-latest 可能太新）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 安装指定版本的 Flutter（3.7.12 是最后一个支持 iOS 12 的版本）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: stable
          cache: true

      # 2. 强制修改 iOS 部署目标为 12.0（防止插件或 Podfile 硬编码更高版本）
      - name: Patch iOS Deployment Target
        run: |
          # 修改 Podfile
          sed -i '' 's/platform :ios, .*/platform :ios, '\''12.0'\''/g' ios/Podfile
          # 修改 Xcode 项目配置（全局替换所有 IPHONEOS_DEPLOYMENT_TARGET 为 12.0）
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 1[0-9]\.[0-9]/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' ios/Runner.xcodeproj/project.pbxproj
          # 同时处理 Podfile 中的部署目标（如果有）
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 1[0-9]\.[0-9]/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' ios/Podfile || true

      # 3. 安装依赖（Flutter 和 CocoaPods）
      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      # 4. 构建 iOS Release（无签名，用于越狱设备）
      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign
          # 打包成 .ipa 格式
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r9 Pilipala_iOS12.ipa Payload/

      # 5. 上传 Artifact（可在 Actions 页面下载）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pilipala-iOS12
          path: Pilipala_iOS12.ipa
          if-no-files-found: error
